spring:
  application:
    name: speech-app
  profiles:
    default: local
  threads:
    virtual:
      enabled: true # Tomcat request threads become virtual, making blocking OpenAI calls cheap for 200+ concurrent requests.
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  shutdown: graceful

openai:
  api-key: ${OPENAI_API_KEY}

---
spring:
  config:
    activate:
      on-profile: local

---
spring:
  config:
    activate:
      on-profile: titan